name: Docker Build and Deploy

on:
  push:
    branches: [main, develop]
    paths:
      - "amber_aim/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "amber_aim/**"
  workflow_dispatch:

env:
  IMAGE_NAME: amber-aim-backend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (optional)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: Build Docker image
        working-directory: ./amber_aim
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest

      - name: Test Docker image
        working-directory: ./amber_aim
        run: |
          # Create a minimal .env file for testing
          cat > .env << EOF
          AWS_ACCESS_KEY_ID=test
          AWS_SECRET_ACCESS_KEY=test
          AWS_S3_BUCKET=test-bucket
          AWS_REGION=us-east-1
          TWELVE_LABS_API_KEY=test
          TWELVE_LABS_CREATORS_INDEX_ID=test
          TWELVE_LABS_ADS_INDEX_ID=test
          OPENAI_API_KEY=test
          LOG_LEVEL=INFO
          EOF

          # Start container
          docker run -d \
            --name test-container \
            -p 8000:8000 \
            --env-file .env \
            ${{ env.IMAGE_NAME }}:latest

          # Wait for service to be ready
          echo "Waiting for service to start..."
          sleep 10

          # Check health endpoint (may fail if credentials are invalid, but container should start)
          docker ps | grep test-container || exit 1

          # Show logs
          docker logs test-container

          # Cleanup
          docker stop test-container
          docker rm test-container

      - name: Push to Docker Hub (optional)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ]; then
            docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          fi
        continue-on-error: true

  deploy-fly:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        if: vars.FLY_IO_ENABLED == 'true'
        working-directory: ./amber_aim
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
